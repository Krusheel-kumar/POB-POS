services:
  - type: web
    name: pob-pos-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: pob-pos-postgres
          property: connectionString

databases:
  - name: pob-pos-postgres
    databaseName: pob_pos
    user: postgres
    plan: free
