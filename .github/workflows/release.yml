name: Build & Release Windows POS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pos-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: pos-web
        run: npm ci

      - name: Build Web Application
        working-directory: pos-web
        run: npm run build

      - name: Package Windows Installer
        working-directory: pos-web
        run: npx electron-builder --win -p never

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.0' }}
          name: POP O' BOB POS Desktop App ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            pos-web/dist-electron/*.exe
            pos-web/dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
